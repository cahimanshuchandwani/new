name: Daily NSE Data Pipeline & Auto-Publisher

on:
  schedule:
    # Runs automatically every day at 14:30 UTC (8:00 PM IST)
    - cron: '30 14 * * *'
  workflow_dispatch: # Enables a manual 'Run workflow' button inside GitHub

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas playwright
          playwright install chromium --with-deps

      - name: 1. Fetch NSE Data & Generate Pine Script
        run: python fetch_and_generate.py

      - name: 2. Auto-Publish Code to TradingView Account
        env:
          TV_SESSION_ID: ${{ secrets.TV_SESSION_ID }}
        run: python publish_to_tv.py

      - name: 3. Commit Updated Files to GitHub Repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add generated_indicator.pine price_bands_db.json
          git commit -m "Auto-update NSE Market Data [$(date -u +'%Y-%m-%d')]" || exit 0
          git push
